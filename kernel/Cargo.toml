stage1-5-test = ["qemu-test"]

[dependencies]
bootloader_api = "0.11.17"
x86_64 = "0.15.5"
spin = "0.10"

smoltcp = { version = "0.14", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "proto-ipv4",
    "socket-icmp",
    "socket-udp",
    "socket-tcp",
    "socket-dhcpv4",
    "socket-dns",
] }
unicode-normalization = { version = "0.1.25", default-features = false }
poly1305 = { version = "0.7.2", features = ["force-soft"] }
[lints.rust]
warnings = "deny"
